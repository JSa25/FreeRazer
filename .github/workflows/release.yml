# Builds FreeRazerSetup.exe on GitHub from this repo and publishes it as a release, so every release is built
# from exactly the code that is here. Run it from the Actions tab (Release > Run workflow) with the release notes.
# Bump APP_VERSION in freerazer.pyw first: installed copies only update to a higher version.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (what users can now do; shown in the update pop-up)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --quiet hidapi pystray pillow pyinstaller
          choco install innosetup -y --no-progress

      - name: Build (self-check, exe, installer, checksum)
        env:
          PYTHON: python
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content freerazer.pyw -Raw), "APP_VERSION = '([\d.]+)'").Groups[1].Value
          if (gh release view "v$version" 2>$null) { throw "v$version is already released: bump APP_VERSION" }
          gh release create "v$version" dist\FreeRazerSetup.exe dist\FreeRazerSetup.exe.sha256 `
              --target $env:GITHUB_SHA --title "FreeRazer $version" --notes $env:NOTES
